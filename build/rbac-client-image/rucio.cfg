[client]
rucio_host = https://rbac-test-server.rucioit.cern.ch
auth_host = https://rbac-test-auth.rucioit.cern.ch
ca_cert = /certs/tls-ca-bundle.pem
# Set your Rucio account name with: set-username
account =
auth_type = userpass
# Username and password follow the account name.
username = %(account)s
password = %(account)s
