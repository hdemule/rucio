[client]
rucio_host = https://rbac-test-server.rucioit.cern.ch
auth_host = https://rbac-test-auth.rucioit.cern.ch
ca_cert = /certs/tls-ca-bundle.pem
# Optional: if your identity maps to several accounts, pick one with: set-username
auth_type = oidc
oidc_audience = rucio
oidc_polling = true
oidc_issuer = escape
oidc_scope = openid profile
auth_token_file_path = /tmp/rucio_oauth.token